<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Mission Control{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/console.css?v=4">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <header class="mast">
      <a class="brand" href="/console">Mission Control</a>
      <iframe class="clock" title="Coordinated universal time" src="/static/clock.html?v=4"></iframe>
      <nav class="nav" aria-label="Console">
        <a {% if nav == 'file' %}class="is-on" aria-current="page"{% endif %} href="/">File a report</a>
        <a {% if nav == 'console' %}class="is-on" aria-current="page"{% endif %} href="/console">Console</a>
      </nav>
    </header>
    <main id="content">
      {% block content %}{% endblock %}
    </main>
    {% if nav != 'file' %}
    <footer class="colophon">
      <span>Wind at or below 25 kt</span>
      <span>Temperature at or above 4 °C</span>
      <span>Fuel 98 to 100 percent</span>
    </footer>
    {% endif %}
  </div>
</body>
</html>
